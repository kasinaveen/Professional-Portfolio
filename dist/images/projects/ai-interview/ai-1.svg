<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0b0f29" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#aiBg)" />
  <rect x="40" y="40" width="1120" height="670" rx="18" fill="#030712" stroke="#6366f1" stroke-width="1.5" opacity="0.9" />

  <!-- Header -->
  <text x="70" y="85" fill="#818cf8" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">
    AI OPEN-SOURCE INTERVIEW KNOWLEDGE ASSESSMENT
  </text>
  <text x="70" y="115" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">
    Candidate Readiness Report &amp; Technical Synthesis
  </text>

  <!-- Left: Assessment Radar / Score Bars -->
  <rect x="70" y="150" width="500" height="520" rx="14" fill="#0a0e27" stroke="#1e293b" />
  <text x="95" y="185" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Competency Assessment Breakdown</text>

  <!-- Metric 1: Java & OOP Knowledge -->
  <text x="95" y="235" fill="#cbd5e1" font-family="sans-serif" font-size="13">Technical Knowledge (Java, OOP, DBMS)</text>
  <rect x="95" y="250" width="450" height="12" rx="6" fill="#1e293b" />
  <rect x="95" y="250" width="410" height="12" rx="6" fill="#10b981" />
  <text x="510" y="240" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">92%</text>

  <!-- Metric 2: Problem Solving -->
  <text x="95" y="305" fill="#cbd5e1" font-family="sans-serif" font-size="13">Problem Solving &amp; Algorithmic Approach</text>
  <rect x="95" y="320" width="450" height="12" rx="6" fill="#1e293b" />
  <rect x="95" y="320" width="395" height="12" rx="6" fill="#06b6d4" />
  <text x="510" y="310" fill="#06b6d4" font-family="monospace" font-size="12" font-weight="700">88%</text>

  <!-- Metric 3: Technical Communication -->
  <text x="95" y="375" fill="#cbd5e1" font-family="sans-serif" font-size="13">Communication &amp; Clarification Clarity</text>
  <rect x="95" y="390" width="450" height="12" rx="6" fill="#1e293b" />
  <rect x="95" y="390" width="380" height="12" rx="6" fill="#818cf8" />
  <text x="510" y="380" fill="#818cf8" font-family="monospace" font-size="12" font-weight="700">85%</text>

  <!-- Metric 4: System Design Concepts -->
  <text x="95" y="445" fill="#cbd5e1" font-family="sans-serif" font-size="13">System Design &amp; Architectural Thinking</text>
  <rect x="95" y="460" width="450" height="12" rx="6" fill="#1e293b" />
  <rect x="95" y="460" width="400" height="12" rx="6" fill="#ec4899" />
  <text x="510" y="450" fill="#ec4899" font-family="monospace" font-size="12" font-weight="700">89%</text>

  <!-- Overall Score Box -->
  <rect x="95" y="510" width="450" height="130" rx="12" fill="#0f172a" stroke="#334155" />
  <text x="120" y="545" fill="#94a3b8" font-family="sans-serif" font-size="12">OVERALL INTERVIEW READINESS</text>
  <text x="120" y="590" fill="#10b981" font-family="sans-serif" font-size="34" font-weight="900">STRONG CANDIDATE</text>
  <text x="120" y="620" fill="#cbd5e1" font-family="sans-serif" font-size="12">High competence in Java OOP, Networking, and Full-Stack pipelines.</text>

  <!-- Right: Dynamic AI Recommendations Feed -->
  <rect x="600" y="150" width="530" height="520" rx="14" fill="#0a0e27" stroke="#1e293b" />
  <text x="625" y="185" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Automated AI Feedback Report</text>
  
  <rect x="625" y="210" width="480" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="645" y="235" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">KEY STRENGTH IDENTIFIED</text>
  <text x="645" y="260" fill="#e2e8f0" font-family="sans-serif" font-size="12">Deep structural understanding of Java OOP, database schemas, and networking sockets.</text>

  <rect x="625" y="320" width="480" height="90" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
  <text x="645" y="345" fill="#06b6d4" font-family="monospace" font-size="12" font-weight="700">RECOMMENDED EXPLORATION</text>
  <text x="645" y="370" fill="#e2e8f0" font-family="sans-serif" font-size="12">Continue expanding cloud deployment pipelines and distributed cache mechanisms.</text>

  <rect x="625" y="430" width="480" height="110" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
  <text x="645" y="455" fill="#818cf8" font-family="monospace" font-size="12" font-weight="700">INTERVIEW STRATEGY</text>
  <text x="645" y="480" fill="#e2e8f0" font-family="sans-serif" font-size="12">Demonstrate full-stack workflow from database transactions to client UI during technical rounds.</text>
</svg>
